name: Build NexusProxy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Долгая сборка Windows не должна отменяться следующим коммитом —
# на этом уже теряли готовые артефакты.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: Тесты движка
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo test --release --manifest-path core/Cargo.toml

  macos:
    name: Сборка под macOS
    runs-on: macos-latest
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          # оба вида процессоров: и Apple, и Intel
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/src-tauri
          key: macos

      - name: Тесты движка на macOS
        run: cargo test --release --manifest-path core/Cargo.toml

      - name: Зависимости интерфейса
        working-directory: app
        run: npm ci

      - name: Окно программы
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin

      - name: Собрать в одну папку
        shell: bash
        run: |
          set -e
          mkdir -p out-mac
          REL=app/src-tauri/target/universal-apple-darwin/release
          echo "── что лежит в $REL/bundle ──"
          ls -la "$REL/bundle" || true
          find "$REL/bundle" -name '*.dmg' -exec cp {} out-mac/ \; 2>/dev/null || true
          find "$REL/bundle" -name '*.tar.gz' -exec cp {} out-mac/ \; 2>/dev/null || true
          find "$REL/bundle" -name '*.sig' -exec cp {} out-mac/ \; 2>/dev/null || true
          ls -la out-mac
          test -n "$(ls -A out-mac)" || { echo "::error::Ничего не собралось"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nexusproxy-macos
          path: out-mac/*

      - name: Добавить к релизу по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out-mac/*

  windows:
    name: Сборка под Windows
    runs-on: windows-latest
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Первая сборка компилирует ~500 пакетов с нуля и занимает ~20 минут.
      # Кеш сохраняется по Cargo.lock, поэтому обновляется только когда
      # зависимости реально изменились.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            app/src-tauri
          key: win-msvc

      # Тег и версия в настройках должны совпадать, иначе на выходе
      # получится файл не той версии, что в релизе.
      - name: Сверить версию с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "тег=$TAG конфиг=$CONF"
          if [ "$CONF" != "$TAG" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $CONF"
            exit 1
          fi

      - name: Консольный движок
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Зависимости интерфейса
        working-directory: app
        run: npm ci

      - name: Окно программы
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Собрать всё в одну папку
        shell: bash
        run: |
          set -e
          mkdir -p out
          REL=app/src-tauri/target/x86_64-pc-windows-msvc/release

          # Имя файла задаёт Tauri, и оно не всегда совпадает с названием
          # программы — ищем, а не угадываем.
          echo "── что лежит в $REL ──"
          ls -la "$REL" | head -30

          APP=$(find "$REL" -maxdepth 1 -name '*.exe' ! -name '*build-script*' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Окно программы не собралось — .exe не найден в $REL"
            exit 1
          fi
          cp "$APP" out/NexusProxy.exe
          echo "окно программы: $APP"

          cp core/target/release/nexusproxy-core.exe out/nexusproxy-console.exe

          # Установщик и подписи для обновления
          find "$REL/bundle" -name '*.exe' -exec cp {} out/ \; 2>/dev/null || true
          find "$REL/bundle" -name '*.sig' -exec cp {} out/ \; 2>/dev/null || true

          cp windows/config.json windows/README.txt out/
          echo "── итог ──"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: nexusproxy-windows
          path: out/*

      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

# сборка: тесты движка на Linux, затем Windows

  feed:
    name: Список обновлений
    runs-on: ubuntu-latest
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Фид собирается отдельным заданием намеренно: раньше он жил внутри
      # Windows-сборки, а файлы от macOS туда физически не доезжают —
      # задания идут параллельно. Из-за этого на маке обновление молчало.
      - uses: actions/download-artifact@v4
        with:
          name: nexusproxy-windows
          path: win
      - uses: actions/download-artifact@v4
        with:
          name: nexusproxy-macos
          path: mac

      - name: Собрать список обновлений
        shell: bash
        run: |
          set -e
          export VER="${GITHUB_REF_NAME#v}"
          export BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

          WIN=$(find win -name '*-setup.exe' | head -1)
          WIN_SIG=$(find win -name '*-setup.exe.sig' | head -1)
          MAC=$(find mac -name '*.app.tar.gz' | head -1)
          MAC_SIG=$(find mac -name '*.app.tar.gz.sig' | head -1)

          for f in "$WIN" "$WIN_SIG" "$MAC" "$MAC_SIG"; do
            if [ -z "$f" ]; then
              echo "::error::Не хватает файла для обновления — оно работать не будет"
              ls -laR win mac; exit 1
            fi
          done

          # Сборка под mac универсальная, один и тот же файл годится
          # и для Apple, и для Intel.
          python3 - <<PYEOF > latest.json
          import json, os, datetime
          def sig(p): return open(p).read().strip()
          base = os.environ["BASE"]
          mac = {"signature": sig("$MAC_SIG"), "url": base + "/" + os.path.basename("$MAC")}
          print(json.dumps({
              "version": os.environ["VER"],
              "notes": "Свежая версия NexusProxy",
              "pub_date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {"signature": sig("$WIN_SIG"),
                                     "url": base + "/" + os.path.basename("$WIN")},
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
              },
          }, ensure_ascii=False, indent=2))
          PYEOF
          cat latest.json

      - name: Добавить к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
