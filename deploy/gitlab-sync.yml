# Синхронизация NexusProxy из GitHub во внутренний GitLab.
#
# Забирает и код, и готовые установщики, чтобы коллеги скачивали
# дистрибутив с вашего ресурса и не ходили на GitHub.
# GitLab обращается наружу сам — снаружи к нему никто не подключается.
#
# Кладётся как .gitlab-ci.yml в ОТДЕЛЬНЫЙ проект nexusproxy-sync.
# В самом зеркале файлам жить нельзя: оно перезаписывается целиком.
#
# Переменные проекта nexusproxy-sync (Settings → CI/CD → Variables):
#   GL_TOKEN     токен проекта-зеркала, роль Maintainer,
#                права api и write_repository. Пометить «Masked»
#   GL_PROJECT   числовой идентификатор проекта-зеркала
#   MIRROR_PATH  путь к зеркалу, например i.korobkov/nexusproxy
#
# Расписание: Settings → CI/CD → Schedules, например раз в час.
# Исполнителю нужен доступ наружу к github.com.

variables:
  SOURCE_REPO: https://github.com/hipocrisle/nexusproxy.git
  RELEASE_API: https://api.github.com/repos/hipocrisle/nexusproxy/releases/latest
  GIT_STRATEGY: none

stages:
  - code
  - dist

mirror-code:
  stage: code
  # Один прогон за раз: ручной запуск и расписание могут совпасть, и тогда
  # два задания лезут в один репозиторий и реестр одновременно.
  resource_group: gitlab-sync
  # ⛔ Не роняем весь конвейер: установщики важнее кода. Если ветка в GitLab
  # защищена, а история на GitHub переписывалась, зеркалу нужен force —
  # его запретят, задание упадёт, и БЕЗ этой строки следом не поедут
  # и дистрибутивы, хотя к ним претензий нет.
  allow_failure: true
  # Обычный alpine, git ставим сами. Образ alpine/git считает всё,
  # что ему передали, командой для git — скрипт до оболочки не доходит.
  image: alpine:latest
  script:
    - apk add --no-cache git ca-certificates
    # Нужно доверять обоим сразу: GitHub с обычными корневыми сертификатами
    # и внутреннему GitLab с вашим. Подсунуть только ваш нельзя — он заменяет
    # весь набор, и тогда отваливается GitHub. Поэтому склеиваем.
    - cp /etc/ssl/certs/ca-certificates.crt /tmp/ca-bundle.crt
    - if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then cat "$CI_SERVER_TLS_CA_FILE" >> /tmp/ca-bundle.crt; fi
    - export GIT_SSL_CAINFO=/tmp/ca-bundle.crt
    - echo "Забираю код из GitHub..."
    - git clone --mirror "$SOURCE_REPO" repo.git
    - cd repo.git
    # --mirror переносит все ветки и теги как есть
    - |
      if git push --mirror "https://oauth2:${GL_TOKEN}@${CI_SERVER_HOST}/${MIRROR_PATH}.git" 2>push.log; then
        echo "Код обновлён."
      else
        cat push.log
        if grep -q "not allowed to force push" push.log; then
          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "Зеркало не может обновиться: ветка защищена, а истории"
          echo "разошлись — на GitHub её переписывали."
          echo ""
          echo "Что сделать один раз в проекте-зеркале:"
          echo "  Settings → Repository → Protected branches → main"
          echo "  включить «Allowed to force push»."
          echo ""
          echo "Установщики при этом выкладываются как обычно —"
          echo "следующим заданием, оно от этого не зависит."
          echo "═══════════════════════════════════════════════════════════"
        fi
        exit 1
      fi

mirror-dist:
  stage: dist
  resource_group: gitlab-sync-dist
  # Пустой needs: задание не ждёт синхронизации кода и не зависит от её
  # исхода. Коллеги качают именно отсюда, и упавшее зеркало кода не должно
  # оставлять их без новой версии.
  needs: []
  image: alpine:latest
  script:
    - apk add --no-cache curl jq ca-certificates
    - |
      set -e
      # тот же склеенный набор: и для GitHub, и для внутреннего GitLab
      cp /etc/ssl/certs/ca-certificates.crt /tmp/ca-bundle.crt
      if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then cat "$CI_SERVER_TLS_CA_FILE" >> /tmp/ca-bundle.crt; fi
      CA="--cacert /tmp/ca-bundle.crt"

      VER=$(curl -sSf $CA "$RELEASE_API" | jq -r .tag_name)
      echo "Последний выпуск на GitHub: $VER"

      # Что уже выложено у нас. Сверяем ПО СОСТАВУ, а не по факту наличия
      # выпуска: иначе добавленный позже файл никогда не доедет — задание
      # увидит выпуск и молча пропустит.
      HAVE=$(curl -sS $CA --header "PRIVATE-TOKEN: $GL_TOKEN" \
             "$CI_API_V4_URL/projects/$GL_PROJECT/releases/$VER" \
             | jq -r '(.assets.links // [])[].name' 2>/dev/null || true)
      echo "Уже выложено: ${HAVE:-ничего}"

      # Установщики для обеих систем. Файлы .sig и .app.tar.gz нужны только
      # автообновлению с GitHub, людям их скачивать незачем.
      curl -sSf $CA "$RELEASE_API" \
        | jq -r '.assets[] | select(.name|test("\\.(exe|dmg)$")) | .browser_download_url' > urls.txt
      test -s urls.txt || { echo "В выпуске нет установщиков"; exit 1; }

      NEW=0
      LINKS=""
      FAILED=""
      while read -r URL; do
        NAME=$(basename "$URL")
        DEST="$CI_API_V4_URL/projects/$GL_PROJECT/packages/generic/nexusproxy/${VER#v}/$NAME"
        LINKS="$LINKS{\"name\":\"$NAME\",\"url\":\"$DEST\"},"
        if echo "$HAVE" | grep -qx "$NAME"; then
          echo "$NAME уже есть в выпуске, пропускаю"
          continue
        fi
        echo "Скачиваю $NAME..."
        if ! curl -sSfL $CA -o "$NAME" "$URL"; then
          echo "  не скачался — пропускаю"; FAILED="$FAILED $NAME"; continue
        fi
        echo "Выкладываю $NAME..."
        # ⛔ Не через -f и не под set -e: повторная выкладка того же файла
        # возвращает 4xx, и это НЕ ошибка. Пайплайн может идти дважды
        # (ручной запуск плюс расписание) — тогда второй приходит на уже
        # занятое имя. Раньше это роняло задание до создания выпуска.
        CODE=$(curl -sS $CA --header "PRIVATE-TOKEN: $GL_TOKEN" \
               --upload-file "$NAME" -o up.log -w '%{http_code}' "$DEST" || echo 000)
        case "$CODE" in
          200|201) echo "  выложен"; NEW=1 ;;
          400|403|409|422)
            echo "  уже был выложен ранее (код $CODE) — считаем сделанным" ;;
          *) echo "  не выложился, код $CODE: $(head -c 200 up.log)"
             FAILED="$FAILED $NAME"; continue ;;
        esac
        # если выпуск уже есть — дописываем ссылку в него
        if [ -n "$HAVE" ]; then
          curl -sS $CA --request POST --header "PRIVATE-TOKEN: $GL_TOKEN" \
            --data "name=$NAME" --data-urlencode "url=$DEST" \
            "$CI_API_V4_URL/projects/$GL_PROJECT/releases/$VER/assets/links" >/dev/null || true
          echo "  ссылка добавлена в существующий выпуск"
        fi
      done < urls.txt

      # Выпуск создаём ВСЕГДА, если его ещё нет: файлы уже в реестре, и
      # без выпуска их никто не найдёт. Раньше сюда не доходили, если хоть
      # один файл споткнулся.
      if [ -z "$HAVE" ]; then
        # ⛔ Выпуск создаётся НА ТЕГ, и если тега в зеркале ещё нет,
        # GitLab отвечает 422 «Ref is not specified». Тег приезжает
        # синхронизацией кода, а она может отставать или падать — тогда
        # установщики повисают в реестре без выпуска, и найти их нельзя.
        # Поэтому передаём ref: GitLab создаст тег сам, из головы ветки.
        REF=$(curl -sS $CA --header "PRIVATE-TOKEN: $GL_TOKEN" \
              "$CI_API_V4_URL/projects/$GL_PROJECT" | jq -r '.default_branch // "main"')
        [ -n "$REF" ] && [ "$REF" != "null" ] || REF=main
        echo "Создаю выпуск $VER (ветка для тега: $REF)..."
        CODE=$(curl -sS $CA --request POST --header "PRIVATE-TOKEN: $GL_TOKEN" \
          --header "Content-Type: application/json" \
          -o rel.log -w '%{http_code}' \
          --data "{\"name\":\"NexusProxy $VER\",\"tag_name\":\"$VER\",\"ref\":\"$REF\",
                   \"description\":\"Собрано из GitHub. Windows — файл с -setup, права администратора не нужны. macOS — файл .dmg, первый запуск через правый клик и «Открыть».\",
                   \"assets\":{\"links\":[${LINKS%,}]}}" \
          "$CI_API_V4_URL/projects/$GL_PROJECT/releases")
        case "$CODE" in
          200|201) echo "Выпуск создан." ;;
          409) echo "Выпуск уже существует — ничего не делаем." ;;
          *) echo "Выпуск не создан, код $CODE: $(head -c 300 rel.log)"; exit 1 ;;
        esac
      fi

      if [ -n "$FAILED" ]; then
        echo "Не доехали файлы:$FAILED"
        exit 1
      fi
      echo "Выпуск $VER готов."
