[package]
name = "nexusproxy-core"
version = "0.9.0"
edition = "2021"
description = "Локальный прокси с правилами: выбранные ресурсы — через вышестоящий SOCKS5, остальное напрямую"

[lib]
name = "nexusproxy_core"
path = "src/lib.rs"

[[bin]]
name = "nexusproxy-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "io-std", "macros", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# скачивание xray по требованию: в состав программы он не входит
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_Networking_WinInet",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
